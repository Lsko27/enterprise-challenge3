spring.datasource.url=jdbc:h2:mem:govatende;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.expiration-ms=3600000

app.upload.dir=./target/test-uploads
app.cors.allowed-origin=http://localhost:3000
app.setup.auditor-key=test-only-auditor-key

govatende.ia.base-url=http://127.0.0.1:9999

app.security.login-rate-limit.max-failures=5
app.security.login-rate-limit.window-seconds=300

server.error.include-message=always
server.error.include-stacktrace=never