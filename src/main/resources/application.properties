spring.application.name=enterprise-challenge3

spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.error.include-exception=false
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

server.port=${SERVER_PORT:8080}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000

govatende.ia.base-url=${GOVATENDE_IA_BASE_URL:http://127.0.0.1:8000}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.security.login-rate-limit.max-failures=${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
app.security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}